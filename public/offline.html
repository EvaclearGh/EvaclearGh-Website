<!doctype html>
<html lang="en-GH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0F5C5A" />
<meta name="robots" content="noindex" />
<title>You're offline | Evaclear</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --p:#0f5c5a; --bg:#faf7f2; --ink:#1d2b2a; --muted:#5b6b69; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px 16px; text-align:center; }
  main { max-width:420px; }
  h1 { font-size:28px; margin:20px 0 8px; }
  p { color:var(--muted); line-height:1.55; margin:0 0 12px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 22px; border-radius:999px;
         font-weight:700; text-decoration:none; border:0; cursor:pointer; font-size:16px; margin:6px; }
  .primary { background:var(--p); color:#fff; }
  .outline { background:transparent; color:var(--p); box-shadow: inset 0 0 0 2px var(--p); }
</style>
</head>
<body>
<main>
  <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0F5C5A"/><path d="M32 12c8 10 15 18 15 27a15 15 0 0 1-30 0c0-9 7-17 15-27z" fill="#A8E3D9"/><path d="M26 40c2 5 6 7 11 6" stroke="#0F5C5A" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
  <h1>You're offline</h1>
  <p>We can't reach the internet right now. Check your data or Wi-Fi and try again. Your cart is saved on this device.</p>
  <p>You can still call us on <a href="tel:+233256116151">025 611 6151</a> or <a href="tel:+233543496952">054 349 6952</a>.</p>
  <button class="btn primary" onclick="location.reload()">Try again</button>
  <a class="btn outline" href="/">Home</a>
</main>
</body>
</html>
